services:
  caddy:
    image: caddy:2-alpine
    container_name: meshmonitor-caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - meshmonitor
      - tileserver

  serial-bridge:
    image: ghcr.io/yeraze/meshtastic-serial-bridge:latest
    container_name: meshtastic-serial-bridge
    devices:
      # udev-Symlink (siehe 99-meshtastic.rules) → reagiert auf alle bekannten Node-Vendor:Product-Kombinationen
      - /dev/meshtastic:/dev/ttyACM0
    ports:
      - "4403:4403"
    # restart: "no" — Lifecycle wird vom systemd-Wrapper (meshtastic-serial-bridge.service)
    # gesteuert. restart: always würde bei Device-Mount-Failure einen Crashloop erzeugen.
    restart: "no"
    environment:
      - SERIAL_DEVICE=/dev/ttyACM0
      - BAUD_RATE=115200
      - TCP_PORT=4403

  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest
    container_name: meshmonitor
    # KEINE ports-Sektion — nur intern via Caddy erreichbar
    restart: unless-stopped
    volumes:
      - meshmonitor-data:/data
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - TZ=Europe/Vienna
      - ALLOWED_ORIGINS=http://meshmonitor.local,http://192.168.8.174,http://localhost,http://10.42.0.1,http://10.43.0.1
      - TRUST_PROXY=true
    depends_on:
      - serial-bridge

  tileserver:
    image: maptiler/tileserver-gl-light:latest
    container_name: meshmonitor-tileserver
    command: --config /data/config.json
    # KEINE ports-Sektion — nur intern via Caddy erreichbar
    restart: unless-stopped
    volumes:
      - ./tiles:/data
    environment:
      - TZ=Europe/Vienna

volumes:
  meshmonitor-data:
    name: meshmonitor-data
  caddy-data:
  caddy-config:
